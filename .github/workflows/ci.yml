name: CI

# A PR branch would match both triggers, so `push` is scoped to main
# (post-merge verification) and `pull_request` covers everything in review.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    env:
      # A throwaway SQLite file, created fresh by the migration step below. The
      # build prerenders the sitemap, which reads the database.
      DATABASE_URL: file:./ci.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `postinstall` runs `prisma generate`, so the client exists after this.
      - name: Install dependencies
        run: npm ci

      - name: Create and seed the database
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
